server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: booking-register
              uri: lb://booking-service
              predicates:
                - Path=/api/auth/register
              filters:
                - RewritePath=/api/auth/register, /user/register
            - id: booking-login
              uri: lb://booking-service
              predicates:
                - Path=/api/auth/login
              filters:
                - RewritePath=/api/auth/login, /user/auth
            - id: booking-users
              uri: lb://booking-service
              predicates:
                - Path=/api/users,/api/users/**
              filters:
                - RewritePath=/api/users(?<segment>.*), /user$\{segment}
            - id: booking-create
              uri: lb://booking-service
              predicates:
                - Method=POST
                - Path=/api/bookings
              filters:
                - RewritePath=/api/bookings, /booking
            - id: booking-history
              uri: lb://booking-service
              predicates:
                - Method=GET
                - Path=/api/bookings
              filters:
                - RewritePath=/api/bookings, /bookings
            - id: booking-by-id
              uri: lb://booking-service
              predicates:
                - Path=/api/bookings/*
              filters:
                - RewritePath=/api/bookings/(?<id>.*), /booking/$\{id}
            - id: hotel-service
              uri: lb://hotel-service
              predicates:
                - Path=/api/hotels/**,/api/rooms/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

stayflow:
  security:
    jwt:
      secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      issuer: https://stayflow.example

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
